<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veerpoint. B2B sales, without the hiring process</title>
<meta name="description" content="Veerpoint puts an experienced B2B seller inside your team to build what's missing in your sales and close the deals.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:"Inter Tight";font-weight:600;font-display:swap;src:url(/fonts/inter-tight-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Inter Tight";font-weight:700;font-display:swap;src:url(/fonts/inter-tight-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(/fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;font-display:swap;src:url(/fonts/inter-latin-500-normal.woff2) format("woff2")}
:root{--page:#FAFAF9;--ink:#1C1C1E;--ink-soft:#48484A;--muted:#6E6E73;--line:#E5E5E5;--stop:#A04022;--stop-dark:#8A361C}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--page);color:var(--ink);font:400 1.0625rem/1.6 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:72rem;margin:0 auto;padding:0 clamp(1rem,5vw,3rem)}
header{padding-top:clamp(1.5rem,4vw,2.5rem)}
.wm{font:600 1.375rem/1 "Inter Tight",sans-serif;letter-spacing:-.05em;color:var(--ink);text-decoration:none}
.wm span,.stop{color:var(--stop)}
main{flex:1;display:flex;align-items:center;padding:clamp(3rem,10vh,7rem) 0}
h1{font:700 clamp(2.6rem,8.2vw,6.5rem)/.98 "Inter Tight",sans-serif;letter-spacing:-.03em;max-width:11ch;text-wrap:balance}
.lede{margin-top:clamp(1.5rem,3vw,2.25rem);max-width:36rem;font-size:clamp(1.0625rem,1.6vw,1.25rem);color:var(--ink-soft)}
.cta{display:inline-block;margin-top:clamp(2rem,4vw,2.75rem);padding:.95rem 1.6rem;background:var(--ink);color:var(--page);font:500 1rem/1 "Inter",sans-serif;text-decoration:none;border-radius:2px;transition:background .15s}
.cta:hover{background:var(--stop)}
.cta:focus-visible,.wm:focus-visible,footer a:focus-visible{outline:2px solid var(--stop);outline-offset:3px}
.note{margin-top:1rem;font-size:.9375rem;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:1.25rem 0 1.5rem;font-size:.875rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:.5rem 2rem;justify-content:space-between}
footer a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--stop);border-color:var(--stop)}
/* the one moment: the full stop lands after the headline */
@media (prefers-reduced-motion:no-preference){
 h1 .stop{display:inline-block;animation:land .5s cubic-bezier(.2,.9,.3,1.3) .45s both}
 @keyframes land{from{opacity:0;transform:translateY(-.5em) scale(.4)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<header><div class="wrap"><a class="wm" href="/" aria-label="Veerpoint home">Veerpoint<span>.</span></a></div></header>
<main><div class="wrap">
<h1>B2B sales, without the hiring process<span class="stop">.</span></h1>
<p class="lede">Veerpoint puts an experienced B2B seller inside your team. They build what's missing in your sales and close the deals themselves.</p>
<a class="cta" href="mailto:hello@veerpoint.io?subject=Book%20a%20call">Book a call</a>
<p class="note">The full site is on its way.</p>
</div></main>
<footer><div class="wrap"><span>Veerpoint</span><a href="mailto:hello@veerpoint.io">hello@veerpoint.io</a></div></footer>
</body>
</html>
